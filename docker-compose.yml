# ============================================================
# Enterprise Agentic RAG Assistant — Docker Compose
# One-command deployment: docker compose up
# ============================================================

services:

  # ── FastAPI Backend ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: enterprise-rag-assistant:latest
    container_name: rag_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - DATA_DIR=/app/data
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - chroma_data:/app/chroma_db
      - document_data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rag_network
    command: >
      python -m uvicorn app.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --log-level info

# ── Persistent Volumes ────────────────────────────────────────
volumes:
  chroma_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./chroma_db
  document_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

# ── Network ───────────────────────────────────────────────────
networks:
  rag_network:
    driver: bridge
    name: enterprise_rag_network
